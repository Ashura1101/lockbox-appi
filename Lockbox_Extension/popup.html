<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOCKBOX Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-container">
    <!-- Encabezado -->
    <header class="app-header">
      <h1 class="logo-title">LOCKBOX</h1>
      <span class="badge-status">API Local</span>
    </header>

    <!-- Menú de Pestañas (Tabs) -->
    <nav class="tabs-nav">
      <button type="button" id="tab-search" class="tab-btn active">🔍 Buscar</button>
      <button type="button" id="tab-add" class="tab-btn">➕ Añadir</button>
    </nav>

    <!-- Main -->
    <main class="app-main">
      <!-- Campo Contraseña Maestra Global -->
      <div class="input-group">
        <label for="master-password" class="input-label">Contraseña Maestra</label>
        <div class="password-wrapper">
          <input type="password" id="master-password" placeholder="Introduce tu contraseña maestra"
            autocomplete="current-password" required>
          <button type="button" id="toggle-master-visibility" class="icon-button" title="Mostrar/ocultar contraseña">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- VISTA 1: BÚSQUEDA -->
      <section id="view-search" class="tab-view active">
        <div class="input-group">
          <label for="search-site" class="input-label">Buscar Sitio Web</label>
          <div class="search-wrapper">
            <input type="text" id="search-site" placeholder="Ej. netflix.com, github.com" autocomplete="off">
          </div>
        </div>

        <button type="button" id="btn-search" class="btn-primary">
          <span>Buscar Credenciales</span>
          <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>

        <div id="results-container" class="results-container"></div>
      </section>

      <!-- VISTA 2: AÑADIR NUEVA CREDENCIAL -->
      <section id="view-add" class="tab-view d-none">
        <form id="add-credential-form">
          <div class="input-group">
            <label for="add-site" class="input-label">Sitio Web</label>
            <input type="text" id="add-site" class="input-field" placeholder="Ej. jkanime.net" required>
          </div>

          <div class="input-group">
            <label for="add-user" class="input-label">Usuario / Email</label>
            <input type="text" id="add-user" class="input-field" placeholder="Ej. mi_usuario" required>
          </div>

          <div class="input-group">
            <label for="add-pass" class="input-label">Contraseña</label>
            <input type="password" id="add-pass" class="input-field" placeholder="••••••••••••" required>
          </div>

          <button type="submit" id="btn-save-credential" class="btn-primary">
            <span>Guardar y Cifrar</span>
          </button>
        </form>
      </section>

      <!-- Mensajes de Estado/Error -->
      <div id="status-message" class="status-message d-none"></div>

      <!-- Separador y Generador Seguro -->
      <div class="separator"></div>

      <div class="input-group">
        <label class="input-label">Generador Seguro</label>
        <div class="length-container">
          <span id="length-val">Longitud: 16 caracteres</span>
          <input type="range" id="gen-length" min="8" max="32" value="16">
        </div>

        <div class="generator-wrapper">
          <input type="text" id="gen-password" placeholder="Haz clic en 🎲 para generar" readonly>
          <div class="generator-actions">
            <button type="button" id="btn-gen-password" class="icon-button-action"
              title="Generar Contraseña">🎲</button>
            <button type="button" id="btn-copy-gen-password" class="icon-button-action"
              title="Copiar Contraseña">📋</button>
          </div>
        </div>
      </div>

      <!-- Botones de seguridad -->
      <button type="button" id="btn-clear-clipboard" class="btn-danger">
        <span>🧹 Limpiar Portapapeles</span>
      </button>
    </main>
  </div>
  <script src="popup.js"></script>
</body>

</html>
