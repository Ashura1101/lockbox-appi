<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Lockbox</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- CABECERA -->
    <header class="header">
      <h1 class="logo">LOCKBOX</h1>
      <div class="header-right">
        <span id="api-status" class="badge">Nube</span>
        <button id="btn-logout" class="btn-icon hidden" title="Cerrar sesión"
          style="background: none; border: none; cursor: pointer; padding: 4px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5555" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- VISTA 1: LOGIN -->
    <div id="view-login" class="view">
      <h2>Iniciar Sesión</h2>
      <form id="form-login">
        <div class="input-group">
          <label>Usuario</label>
          <input type="text" id="login-username" placeholder="Ej: yefer" required>
        </div>
        <div class="input-group">
          <label>Contraseña Maestra</label>
          <input type="password" id="login-password" placeholder="••••••••••••" required>
        </div>
        <button type="submit" id="btn-login-submit" class="btn-primary">Entrar</button>
      </form>
    </div>

    <!-- VISTA 2: PANEL PRINCIPAL (Oculto al inicio) -->
    <div id="view-main" class="view hidden">
      <div class="user-bar">
        <span>Usuario: <strong id="active-user-display"></strong></span>
      </div>

      <!-- PESTAÑAS (BUSCAR / AÑADIR) -->
      <div class="tabs">
        <button id="tab-search" class="tab-btn active">🔍 Buscar</button>
        <button id="tab-add" class="tab-btn">➕ Añadir</button>
      </div>

      <!-- CONTENIDO BUSCAR -->
      <div id="view-search" class="tab-content">
        <div class="input-group">
          <label>Buscar Sitio Web</label>
          <input type="text" id="search-site" placeholder="youtube.com">
        </div>
        <button id="btn-search" class="btn-primary">Buscar Credenciales 🔍</button>
        <div id="results-container" class="results-list"></div>
      </div>

      <!-- CONTENIDO AÑADIR -->
      <form id="add-credential-form" class="tab-content hidden">
        <div class="input-group">
          <label>Sitio Web / Servicio</label>
          <input type="text" id="add-site" placeholder="github.com" required>
        </div>
        <div class="input-group">
          <label>Usuario / Email del sitio</label>
          <input type="text" id="add-user" placeholder="mi_usuario" required>
        </div>
        <div class="input-group">
          <label>Contraseña a Guardar</label>
          <input type="password" id="add-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Guardar Credencial 💾</button>
      </form>
    </div>

    <!-- MENSAJES DE ESTADO -->
    <div id="status-message" class="status-msg hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
