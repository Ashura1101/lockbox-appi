name: lockbox_mobile
description: Aplicación móvil del Gestor de Contraseñas Lockbox.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Peticiones HTTP al backend en Render
  http: ^1.2.1

  # Almacenamiento seguro de tokens (Keychain / Keystore)
  flutter_secure_storage: ^10.3.4

  # Autenticación biométrica (huella / Face ID)
  local_auth: ^2.2.0

  # Manejo de estado
  provider: ^6.1.2

  cupertino_icons: ^1.0.6
  sqflite: ^2.4.1
  path: ^1.9.0
  bcrypt: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true